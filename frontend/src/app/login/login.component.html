<div class="login-page">
  <div class="login-card card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="login-icon-wrap mb-3">
          <i class="fas fa-lock"></i>
        </div>
        <h1 class="h4 mb-1">Connexion</h1>
        <p class="text-muted small mb-0">Gestion Achats — accès sécurisé</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label" for="username">Utilisateur</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            autocomplete="username"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" />
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Mot de passe</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          Se connecter
        </button>
      </form>

      <p class="text-muted small mt-4 mb-0 text-center">
        Compte par défaut : <strong>admin</strong> / <strong>admin123</strong>
      </p>
    </div>
  </div>
</div>
