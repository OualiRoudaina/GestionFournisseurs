<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid px-4">

        <i class="fas fa-shopping-cart brand-icon"></i>

      </div>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: true}">
            <i class="fas fa-tachometer-alt"></i>
            <span>Dashboard</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/fournisseurs" routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: false}">
            <i class="fas fa-building"></i>
            <span>Fournisseurs</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/commandes" routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: false}">
            <i class="fas fa-shopping-bag"></i>
            <span>Commandes</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/lignes-commande" routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: false}">
            <i class="fas fa-list-alt"></i>
            <span>Lignes commande</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/historique" routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: false}">
            <i class="fas fa-history"></i>
            <span>Historique</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/comparaison-offres" routerLinkActive="active">
            <i class="fas fa-balance-scale"></i>
            <span>Comparaison</span>
          </a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item d-none d-lg-block" *ngIf="displayName">

          </span>
        </li>
        <li class="nav-item">
          <button type="button" class="btn btn-outline-light btn-sm me-lg-2 mb-2 mb-lg-0" (click)="logout()">

        <li class="nav-item">
          <a class="nav-link" [href]="swaggerDocsUrl" target="_blank" rel="noopener noreferrer">
