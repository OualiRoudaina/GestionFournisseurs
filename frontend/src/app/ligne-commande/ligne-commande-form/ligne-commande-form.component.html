<div class="container-fluid fade-in">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="card">
        <div class="card-header">
          <h4 class="mb-0">
            <i class="fas fa-list-alt me-2"></i>
            {{ isEditMode ? 'Modifier la ligne de commande' : 'Nouvelle ligne de commande' }}
          </h4>
        </div>
        <div class="card-body">
          <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>{{ errorMessage }}
          </div>

          <div *ngIf="successMessage" class="alert alert-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>{{ successMessage }}
          </div>

          <div *ngIf="loading && isEditMode" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted mb-0">Chargement…</p>
          </div>

          <form [formGroup]="ligneForm" (ngSubmit)="onSubmit()" *ngIf="!(loading && isEditMode)">
            <div class="mb-4">
              <label for="commandeId" class="form-label">
                <i class="fas fa-shopping-bag me-1"></i>Commande *
              </label>
              <select
                id="commandeId"
                class="form-select"
                formControlName="commandeId"
                [class.is-invalid]="isFieldInvalid('commandeId')">
                <option value="">-- Choisir une commande --</option>
                <option *ngFor="let c of commandes" [value]="c.id">{{ commandeLabel(c) }}</option>
              </select>
              <div class="invalid-feedback">{{ getFieldErrorMessage('commandeId') }}</div>
            </div>

            <div class="mb-4">
              <label for="produit" class="form-label">
                <i class="fas fa-box me-1"></i>Produit *
              </label>
              <input
                type="text"
                id="produit"
                class="form-control"
                formControlName="produit"
                placeholder="Nom du produit"
                [class.is-invalid]="isFieldInvalid('produit')" />
              <div class="invalid-feedback">{{ getFieldErrorMessage('produit') }}</div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <label for="quantite" class="form-label">
                  <i class="fas fa-sort-numeric-up me-1"></i>Quantité *
                </label>
                <input
                  type="number"
                  id="quantite"
                  class="form-control"
                  formControlName="quantite"
                  min="1"
                  step="1"
                  [class.is-invalid]="isFieldInvalid('quantite')" />
                <div class="invalid-feedback">{{ getFieldErrorMessage('quantite') }}</div>
              </div>
              <div class="col-md-6 mb-4">
                <label for="prixUnitaire" class="form-label">
                  <i class="fas fa-euro-sign me-1"></i>Prix unitaire (€) *
                </label>
                <input
                  type="number"
                  id="prixUnitaire"
                  class="form-control"
                  formControlName="prixUnitaire"
                  min="0.01"
                  step="0.01"
                  [class.is-invalid]="isFieldInvalid('prixUnitaire')" />
                <div class="invalid-feedback">{{ getFieldErrorMessage('prixUnitaire') }}</div>
              </div>
            </div>

            <div class="d-flex flex-wrap gap-2 justify-content-end pt-2">
              <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="loading">
                Annuler
              </button>
              <button type="submit" class="btn btn-primary" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
                {{ isEditMode ? 'Enregistrer' : 'Créer la ligne' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
