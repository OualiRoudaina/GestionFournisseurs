# Configuration de l'application
spring.application.name=GestionFournisseurs

# Configuration du serveur
server.port=8080

# CORS (origines frontend autorisees, separees par des virgules)
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:8082,http://127.0.0.1:8082,http://localhost:80,http://localhost,http://34.79.139.189

# Configuration de la base de données (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_fournisseurs?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.gestionfournisseurs=DEBUG

# OpenAPI / Swagger UI : http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT (cle >= 32 caracteres UTF-8)
app.jwt.secret=GestionFournisseursJWT-Secret-2026-Min32Chars!
app.jwt.expiration-ms=86400000

# Compte administrateur cree automatiquement si absent (table app_users)
app.security.admin-username=admin
app.security.admin-password=admin123
