# Profil utilisé par docker-compose (MySQL service nommé "mysql")
spring.datasource.url=jdbc:mysql://mysql:3306/gestion_fournisseurs?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

app.cors.allowed-origins=http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:8082,http://127.0.0.1:8082,http://localhost:4200,http://127.0.0.1:4200

logging.level.org.springframework=INFO
logging.level.com.gestionfournisseurs=INFO

app.jwt.secret=GestionFournisseursJWT-Docker-Secret-2026-Min32Chars!
app.jwt.expiration-ms=86400000
app.security.admin-username=admin
app.security.admin-password=admin123
