# Cloud Run : PORT est injecté par la plateforme (souvent 8080)
server.port=${PORT:8080}

# Base MySQL : définir sur Cloud Run (Cloud SQL socket ou IP publique)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.org.springframework=INFO
logging.level.com.gestionfournisseurs=INFO

app.jwt.secret=${APP_JWT_SECRET:GestionFournisseursJWT-CloudRun-Min32Chars!!!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.security.admin-username=${APP_SECURITY_ADMIN_USERNAME:admin}
app.security.admin-password=${APP_SECURITY_ADMIN_PASSWORD:admin123}
