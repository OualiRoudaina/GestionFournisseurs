services:
  mysql:
    image: mysql:8.0
    container_name: gf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_fournisseurs
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: gf-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:8082,http://127.0.0.1:8082,http://localhost:4200,http://127.0.0.1:4200
    # 8090 sur l’hôte si 8080 est déjà pris (IDE, autre Spring Boot, etc.)
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gf-frontend
    environment:
      BACKEND_BASE: http://backend:8080
    ports:
      # Port dédié au front de ce projet pour éviter les conflits avec d'autres apps locales.
      - "8082:80"
    depends_on:
      - backend

volumes:
  mysql_data:
